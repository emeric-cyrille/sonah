# Production — VPS partagé seazone (51.254.137.22)
#
# - Les conteneurs web et api rejoignent le réseau externe `portfolio-net` :
#   Traefik (portfolio-traefik) les joint par leur nom, aucun port n'est publié sur l'hôte.
# - Les images sont construites par la CI et publiées sur GHCR (voir .github/workflows/deploy.yml).
# - PostgreSQL (pgvector) démarre toujours : conversations et base vectorielle de Sonah.
# - Neo4j est dans le profil `graph` (graphe des démarches, ~800 Mo de RAM) : activé avec
#   `--profile graph` et NEO4J_URI=bolt://neo4j:7687 dans .env.production.
# - Redis et RabbitMQ sont dans le profil `queue` (orchestration multi-agents, à venir).

name: sonah

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  web:
    image: ghcr.io/emeric-cyrille/sonah-web:${IMAGE_TAG:-latest}
    container_name: sonah-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
    networks:
      - portfolio-net
    mem_limit: 512m
    logging: *default-logging

  api:
    image: ghcr.io/emeric-cyrille/sonah-api:${IMAGE_TAG:-latest}
    container_name: sonah-api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      API_PORT: 4000
      APP_VERSION: ${IMAGE_TAG:-latest}
      DATABASE_URL: postgresql://sonah_user:${POSTGRES_PASSWORD:-}@postgres:5432/sonah_prod
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - portfolio-net
      - sonah-internal
    mem_limit: 1g
    logging: *default-logging

  postgres:
    image: pgvector/pgvector:pg16
    container_name: sonah-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonah_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: sonah_prod
    command: postgres -c shared_buffers=96MB -c max_connections=40
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - sonah-internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sonah_user -d sonah_prod']
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    logging: *default-logging

  neo4j:
    profiles: ['graph']
    image: neo4j:5-community
    container_name: sonah-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_max__size: 384m
      NEO4J_server_memory_pagecache_size: 128m
    volumes:
      - neo4j_data:/data
    networks:
      - sonah-internal
    healthcheck:
      test: ['CMD-SHELL', 'cypher-shell -u neo4j -p "$${NEO4J_AUTH#neo4j/}" "RETURN 1" || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    logging: *default-logging

  redis:
    profiles: ['queue']
    image: redis:7-alpine
    container_name: sonah-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    networks:
      - sonah-internal
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    logging: *default-logging

  rabbitmq:
    profiles: ['queue']
    image: rabbitmq:3-management-alpine
    container_name: sonah-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - sonah-internal
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    logging: *default-logging

volumes:
  postgres_data:
  neo4j_data:
  redis_data:
  rabbitmq_data:

networks:
  portfolio-net:
    external: true
  sonah-internal:
    driver: bridge
