# ═══════════════════════════════════════════════════════════════════
# sonah.yml — route Traefik de SONAH (fichier SÉPARÉ de routes.yml)
# À copier dans /home/deploy/portfolio/traefik/dynamic/ — rechargé à chaud, sans redémarrer Traefik.
# Les conteneurs sonah-web et sonah-api sont rattachés au réseau portfolio-net :
# Traefik les joint par leur nom.
#
# Un seul domaine : /api/v1/* → API NestJS, tout le reste → Next.js (pas de CORS nécessaire).
# ═══════════════════════════════════════════════════════════════════

http:
  middlewares:
    sonah-security:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: false
        forceSTSHeader: true
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: 'strict-origin-when-cross-origin'

    sonah-api-ratelimit:
      rateLimit:
        average: 20
        period: 1s
        burst: 40

  routers:
    sonah-api:
      rule: 'Host(`sonah.fokamemeric.com`) && PathPrefix(`/api/v1`)'
      priority: 100
      entryPoints:
        - websecure
      service: sonah-api
      middlewares:
        - sonah-security
        - sonah-api-ratelimit
      tls:
        certResolver: le

    sonah-web:
      rule: 'Host(`sonah.fokamemeric.com`)'
      priority: 10
      entryPoints:
        - websecure
      service: sonah-web
      middlewares:
        - sonah-security
      tls:
        certResolver: le

  services:
    sonah-web:
      loadBalancer:
        servers:
          - url: 'http://sonah-web:3000'
        healthCheck:
          path: /healthz
          interval: 30s
          timeout: 5s

    sonah-api:
      loadBalancer:
        servers:
          - url: 'http://sonah-api:4000'
        healthCheck:
          path: /api/v1/health
          interval: 30s
          timeout: 5s
