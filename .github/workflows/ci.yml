name: CI

# Sur main, la CI est appelée par le workflow Deploy (workflow_call) avant toute publication.
on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sonah
          POSTGRES_PASSWORD: sonah
          POSTGRES_DB: sonah_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sonah -d sonah_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/sonah-test-password
        ports: ['7687:7687']
        options: >-
          --health-cmd "cypher-shell -u neo4j -p sonah-test-password 'RETURN 1'"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgresql://sonah:sonah@localhost:5432/sonah_test
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: sonah-test-password
      RAG_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Database migrations
        run: pnpm --filter @sonah/database exec prisma migrate deploy

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  docker:
    name: Docker build (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Sur main, le workflow Deploy construit et publie les images : inutile de les construire deux fois
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        app: [web, api]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.app }}.prod
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
