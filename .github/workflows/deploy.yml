name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/sonah

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    name: Publish image (${{ matrix.app }})
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [web, api]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.app }}.prod
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    name: Deploy to VPS
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://sonah.fokamemeric.com
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CONFIG
          Host vps
            HostName ${{ secrets.VPS_HOST }}
            Port ${{ secrets.VPS_PORT }}
            User ${{ secrets.VPS_USER }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            ServerAliveInterval 15
            ConnectTimeout 30
          CONFIG

      - name: Upload deployment files
        run: |
          ssh vps 'mkdir -p ~/sonah/scripts ~/sonah/traefik/dynamic ~/sonah/infrastructure/postgres'
          scp docker-compose.prod.yml vps:~/sonah/
          scp scripts/deploy.sh vps:~/sonah/scripts/
          scp traefik/dynamic/sonah.yml vps:~/sonah/traefik/dynamic/
          scp infrastructure/postgres/init.sql vps:~/sonah/infrastructure/postgres/

      - name: Deploy
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh vps "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          status=0
          ssh vps "bash ~/sonah/scripts/deploy.sh '${{ github.sha }}'" || status=$?
          ssh vps 'docker logout ghcr.io' || true
          exit "$status"

      - name: Smoke test
        run: |
          for path in / /healthz /api/v1/health; do
            for attempt in 1 2 3 4 5; do
              if curl -fsS -o /dev/null --max-time 10 "https://sonah.fokamemeric.com$path"; then
                echo "✓ $path"; break
              fi
              [ "$attempt" = 5 ] && { echo "✗ $path"; exit 1; }
              sleep 6
            done
          done
