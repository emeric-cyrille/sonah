slug: sonah-agentic-rag-reference
name: SONAH - Agentic RAG Reference for Citizen Legal Information
description: 'Rebuilds the SONAH pipeline with no API key on the public FAOLEX texts of
  the Cameroonian Constitution (1996) and Labour Code (1992), downloaded at run time: legal
  article chunker, TF-IDF (or multilingual) retriever, packaged agent with retrieve/answer/refuse
  tools and a blocking Y.3172 P-node guardrail with typed verdicts (incl. OUTDATED_TEXT for
  articles amended by Law No. 2008/001). Reports answered / refused / accuracy-on-answered /
  recall@k with Wilson CIs, a threshold sweep and tool traces. Runs on Colab free tier (CPU).'
